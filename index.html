<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabeltrainer · Camden Town 4 · Theme 2 A (Thanksgiving)</title>
<style>
:root{
  /* Himbeerrot: --accent bei Bedarf an den genauen Farbton des Schullogos anpassen */
  --bg:#fbf4f6; --card:#ffffff; --ink:#2a2226; --muted:#65585d; --line:#ead7de;
  --accent:#b0134a; --accent-ink:#ffffff; --accent-soft:#fbe3eb;
  --ok:#1f7a3d; --ok-soft:#dff3e4; --bad:#9a3412; --bad-soft:#fde9dc; --mid:#8a5a00; --mid-soft:#fff0c9;
  --focus:#1a5fd0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1f161a; --card:#2c2025; --ink:#f6eaee; --muted:#cbb7bf; --line:#4d3a42;
    --accent:#ef5f8f; --accent-ink:#1f161a; --accent-soft:#40202c;
    --ok:#6fd08c; --ok-soft:#1e3a28; --bad:#ffb089; --bad-soft:#4a2a1b; --mid:#ffd166; --mid-soft:#3d3115;
    --focus:#7db1ff;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:1.45rem;line-height:1.2;margin:0}
h2{font-size:1.15rem;margin:0 0 8px}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{appearance:none;font:inherit;font-weight:600;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);min-height:44px}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{font:inherit;font-weight:600;min-height:44px;padding:8px 16px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q{font-size:1.6rem;font-weight:700;line-height:1.25;margin:14px 0 4px;overflow-wrap:anywhere}
.q.sentence{font-size:1.3rem;font-weight:600}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);margin:0 4px;text-align:center}
.hint{color:var(--muted);margin:0 0 12px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{font:inherit;text-align:left;min-height:56px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
input.txt{font:inherit;font-size:1.2rem;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.mid{background:var(--mid-soft);color:var(--mid)}
.fb small{display:block;font-weight:400;color:var(--ink);margin-top:2px}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}
.score{font-size:2.2rem;font-weight:800;margin:4px 0}
.list{list-style:none;padding:0;margin:8px 0}
.list li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.mark.ok{background:var(--ok-soft);color:var(--ok)}
.mark.bad{background:var(--bad-soft);color:var(--bad)}
.small{font-size:.9rem;color:var(--muted)}

.qrov{position:fixed;inset:0;background:rgba(25,10,16,.85);display:grid;place-items:center;padding:16px;z-index:50}
.qrbox{background:#fff;color:#2a2226;border-radius:22px;padding:22px;text-align:center;max-width:96vw}
.qrbox h2{font-size:1.6rem;margin:0 0 12px;color:#2a2226}
.qrbox svg{display:block;margin:0 auto;width:min(68vh,84vw);height:min(68vh,84vw)}
.qrbox p{margin:12px 0;font-size:1rem;color:#4a3d43;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Wyoming · Section A: Thanksgiving</h1>
      <p class="sub">Camden Town 4 · Theme 2 A · Lückensätze</p>
    </div>
    <button class="btn" id="qrbtn" aria-haspopup="dialog">QR-Code anzeigen</button>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
"use strict";
/* ===== Daten ===== */
const WORDS=[
 {id:0,en:"holiday",de:"Urlaub, Ferien, hier: Feiertag",acc:["holiday","holidays"],gap:"Thanksgiving is an important ___ in the USA."},
 {id:1,en:"traditional",de:"traditionell",acc:["traditional"],gap:"On Thanksgiving, many families eat a ___ dinner with turkey."},
 {id:2,en:"bottom",de:"untere(r, s)",acc:["bottom"],gap:"Look at the ___ picture, not at the top one."},
 {id:3,en:"to hunt",de:"jagen",acc:["to hunt","hunt"],gap:"In autumn, the men went out ___ deer."},
 {id:4,en:"Native American",de:"amerikanischer Ureinwohner/amerikanische Ureinwohnerin",acc:["native american","native americans"],gap:"Long before the settlers came, ___ people lived on this land."},
 {id:5,en:"European",de:"Europäer/in, europäisch",acc:["european","europeans"],gap:"The first ___ settlers came across the Atlantic Ocean in 1620."},
 {id:6,en:"settler",de:"Siedler/in",acc:["settler","settlers"],gap:"A ___ is a person who moves to a new land and builds a home there."},
 {id:7,en:"useful",de:"nützlich, praktisch",acc:["useful"],gap:"A good dictionary is very ___ when you learn English."},
 {id:8,en:"to paraphrase",de:"umschreiben, (mit anderen Worten) wiedergeben",acc:["to paraphrase","paraphrase"],gap:"Please try ___ the text in your own words."}
];
const N=WORDS.length;

/* ===== Logik (rein) ===== */
function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-zäöüß\s'-]/g," ").replace(/\s+/g," ").trim();}
function core(s){return norm(s).replace(/^(to|a|an|the)\s+/,"");}
function isCorrect(w,input){const c=core(input);return c!==""&&w.acc.some(a=>core(a)===c);}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}p=c;}return p[n];}
function nearMiss(w,input){const c=core(input);if(!c)return false;return w.acc.some(a=>{const t=core(a);return lev(c,t)<=2&&t.length>=5;});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* ===== UI-Helfer ===== */
const app=document.getElementById("app");
let level="B"; // B = Basis, E = Erweiterung
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(typeof v==="boolean"&&k.startsWith("aria-"))e.setAttribute(k,String(v));
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
function view(...nodes){app.replaceChildren(...nodes);window.scrollTo(0,0);}
function progress(done,total){const p=h("div",{class:"prog",role:"progressbar","aria-valuemin":0,"aria-valuemax":total,"aria-valuenow":done});p.append(h("i",{style:"width:"+Math.round(100*done/total)+"%"}));return p;}
function sentenceNode(txt){
  const parts=txt.split("___");
  return h("div",{class:"q sentence"},parts[0],h("span",{class:"blank","aria-label":"Lücke"},"     "),parts[1]||"");
}
/* ===== Startseite ===== */
function startGap(){quiz({title:"Lückensätze",questions:gapQuestions(),check:false});}
function home(){
  const lvl=h("div",{class:"seg",role:"group","aria-label":"Niveau"},
    h("button",{"aria-pressed":level==="B",onclick:()=>{level="B";home();}},"Basis"),
    h("button",{"aria-pressed":level==="E",onclick:()=>{level="E";home();}},"Erweiterung"));
  view(
    h("div",{class:"card"},
      h("h2",null,"Lückensätze"),
      h("p",{style:"margin:0 0 10px"},"9 Sätze, in jedem fehlt eine Vokabel aus Section A. Falsche Antworten kommen später noch einmal. Deine Antworten werden nirgends gespeichert."),
      h("div",{class:"row"},h("b",null,"Niveau:"),lvl),
      h("p",{class:"small",style:"margin:8px 0 14px"},level==="B"?"Basis: Du wählst das passende Wort aus vier Möglichkeiten.":"Erweiterung: Du schreibst das passende Wort selbst."),
      h("button",{class:"btn primary",onclick:startGap},"Los geht’s")));
}
/* ===== Fragen bauen ===== */
function distractors(w,key){return shuffle(WORDS.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x[key]);}
function mcOptions(w,key){return shuffle([{text:w[key],correct:true}].concat(distractors(w,key).map(t=>({text:t,correct:false}))));}
function gapQuestions(){
  return shuffle(WORDS).map(w=>level==="B"
    ?{w,kind:"mc",sentence:w.gap,sub:"Welches Wort passt in die Lücke?",options:mcOptions(w,"en"),answerText:w.en}
    :{w,kind:"type",sentence:w.gap,sub:"Schreibe das passende Wort aus Section A in die Lücke.",answerText:w.en});
}
/* ===== Quiz-Runner ===== */
function quiz(opts){
  const check=!!opts.check;
  const queue=opts.questions.slice();
  const mastered=new Set();
  const firstTry={};
  const seen=new Set();
  function next(){
    if(!queue.length){return showResult(firstTry);}
    render(queue.shift());
  }
  function finishQ(q,ok){
    const first=!seen.has(q.w.id);
    seen.add(q.w.id);
    if(first)firstTry[q.w.id]=ok;
    if(ok)mastered.add(q.w.id);
    if(!ok&&!check)queue.push(q);
    return first;
  }
  function render(q){
    const top=h("div",{class:"row spread"},
      h("button",{class:"btn ghost",onclick:home},"✕ Abbrechen"),
      progress(check?(N-queue.length-1):mastered.size,N),
      h("span",{class:"small"},check?("Frage "+(N-queue.length)+" von "+N):(mastered.size+" von "+N+" geschafft")));
    const head=q.sentence?sentenceNode(q.sentence):h("div",{class:"q"},q.prompt);
    const sub=h("p",{class:"hint"},q.sub);
    const body=h("div");
    const fb=h("div",{"aria-live":"polite"});
    const card=h("div",{class:"card"},head,sub,body,fb);
    view(h("div",{class:"row"},h("b",null,opts.title+(check?" · "+(level==="B"?"Basis":"Erweiterung"):""))),top,card);

    function afterAnswer(ok,extra){
      finishQ(q,ok);
      if(check){next();return;}
      fb.replaceChildren(h("div",{class:"fb "+(ok?"ok":"bad")},
        ok?"Richtig!":"Nicht ganz.",
        h("small",null,ok?q.answerText:("Richtig ist: "+q.answerText+(extra?" ("+extra+")":"")+". Das üben wir gleich noch einmal."))));
      const nb=h("button",{class:"btn primary",style:"margin-top:12px",onclick:next},"Weiter →");
      fb.append(nb);nb.focus();
    }

    if(q.kind==="mc"){
      const grid=h("div",{class:"opts"});
      q.options.forEach(o=>{
        const b=h("button",{class:"opt",onclick:()=>{
          const all=[...grid.children];
          if(!check){
            all.forEach(x=>{x.disabled=true;});
            all.forEach((x,i)=>{if(q.options[i].correct)x.classList.add("ok");});
            if(!o.correct)b.classList.add("bad");
          }
          afterAnswer(o.correct);
        }},o.text);
        grid.append(b);
      });
      body.append(grid);
    }else{
      const inp=h("input",{class:"txt",type:"text",autocomplete:"off",autocapitalize:"none",autocorrect:"off",spellcheck:"false",enterkeyhint:"done","aria-label":"Deine Antwort"});
      let hintLevel=0;
      const hintBtn=h("button",{class:"btn",onclick:()=>{
        hintLevel++;
        const a=q.answerText;
        fb.replaceChildren(h("div",{class:"fb mid"},"Tipp: "+a.slice(0,Math.min(hintLevel,a.length))+"…"));
        inp.focus();
      }},"Tipp");
      const go=h("button",{class:"btn primary",onclick:submit},"Prüfen");
      function submit(){
        if(!inp.value.trim()){inp.focus();return;}
        const ok=isCorrect(q.w,inp.value);
        go.disabled=true;hintBtn.disabled=true;inp.disabled=true;
        const near=!ok&&nearMiss(q.w,inp.value);
        afterAnswer(ok,near&&!check?"fast, achte auf die Schreibweise":"");
      }
      inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit();}});
      body.append(inp,h("div",{class:"row",style:"margin-top:12px"},go,check?null:hintBtn));
      setTimeout(()=>inp.focus(),50);
    }
  }
  next();
}
function showResult(results){
  const score=WORDS.filter(w=>results[w.id]).length;
  view(h("div",{class:"card"},
    h("h2",null,"Geschafft!"),
    h("div",{class:"score"},score+" von "+N),
    h("p",null,"beim ersten Versuch richtig."),
    h("ul",{class:"list"},WORDS.map(w=>h("li",null,
      h("span",{class:"mark "+(results[w.id]?"ok":"bad"),"aria-label":results[w.id]?"richtig":"nicht beim ersten Versuch"},results[w.id]?"✓":"!"),
      h("span",null,h("b",null,w.en)," – ",w.de)))),
    h("div",{class:"row"},
      h("button",{class:"btn primary",onclick:startGap},"Noch einmal üben"),
      h("button",{class:"btn",onclick:home},"Zurück zum Start"))));
}
/* ===== QR-Code (für Viewboard) – zeigt auf die GitHub-Pages-Adresse ===== */
const QR_URL="https://cruhnau.github.io/vokabeltrainer/";
const QR_PATH="M0 0h7v1h-7zM9 0h1v1h-1zM11 0h5v1h-5zM17 0h4v1h-4zM22 0h7v1h-7zM0 1h1v1h-1zM6 1h1v1h-1zM8 1h1v1h-1zM11 1h3v1h-3zM15 1h2v1h-2zM18 1h2v1h-2zM22 1h1v1h-1zM28 1h1v1h-1zM0 2h1v1h-1zM2 2h3v1h-3zM6 2h1v1h-1zM9 2h4v1h-4zM16 2h1v1h-1zM18 2h3v1h-3zM22 2h1v1h-1zM24 2h3v1h-3zM28 2h1v1h-1zM0 3h1v1h-1zM2 3h3v1h-3zM6 3h1v1h-1zM10 3h3v1h-3zM14 3h2v1h-2zM18 3h2v1h-2zM22 3h1v1h-1zM24 3h3v1h-3zM28 3h1v1h-1zM0 4h1v1h-1zM2 4h3v1h-3zM6 4h1v1h-1zM8 4h1v1h-1zM13 4h3v1h-3zM17 4h3v1h-3zM22 4h1v1h-1zM24 4h3v1h-3zM28 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM9 5h2v1h-2zM14 5h2v1h-2zM17 5h1v1h-1zM19 5h2v1h-2zM22 5h1v1h-1zM28 5h1v1h-1zM0 6h7v1h-7zM8 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h1v1h-1zM20 6h1v1h-1zM22 6h7v1h-7zM10 7h2v1h-2zM13 7h1v1h-1zM17 7h4v1h-4zM0 8h1v1h-1zM2 8h1v1h-1zM4 8h1v1h-1zM6 8h1v1h-1zM9 8h3v1h-3zM13 8h1v1h-1zM17 8h1v1h-1zM24 8h1v1h-1zM27 8h1v1h-1zM0 9h3v1h-3zM4 9h1v1h-1zM7 9h2v1h-2zM10 9h1v1h-1zM13 9h1v1h-1zM16 9h1v1h-1zM20 9h3v1h-3zM25 9h1v1h-1zM28 9h1v1h-1zM1 10h4v1h-4zM6 10h1v1h-1zM8 10h1v1h-1zM10 10h1v1h-1zM12 10h1v1h-1zM16 10h2v1h-2zM20 10h2v1h-2zM24 10h1v1h-1zM26 10h3v1h-3zM0 11h6v1h-6zM8 11h3v1h-3zM13 11h7v1h-7zM21 11h4v1h-4zM27 11h1v1h-1zM0 12h2v1h-2zM3 12h1v1h-1zM5 12h2v1h-2zM8 12h1v1h-1zM10 12h2v1h-2zM13 12h1v1h-1zM17 12h6v1h-6zM25 12h1v1h-1zM27 12h2v1h-2zM1 13h4v1h-4zM7 13h3v1h-3zM11 13h1v1h-1zM13 13h2v1h-2zM16 13h1v1h-1zM20 13h3v1h-3zM25 13h1v1h-1zM28 13h1v1h-1zM3 14h1v1h-1zM5 14h2v1h-2zM8 14h1v1h-1zM10 14h5v1h-5zM16 14h2v1h-2zM20 14h1v1h-1zM22 14h4v1h-4zM27 14h2v1h-2zM1 15h2v1h-2zM7 15h1v1h-1zM9 15h2v1h-2zM12 15h2v1h-2zM15 15h6v1h-6zM25 15h1v1h-1zM27 15h1v1h-1zM1 16h2v1h-2zM5 16h3v1h-3zM9 16h9v1h-9zM21 16h3v1h-3zM25 16h1v1h-1zM27 16h2v1h-2zM3 17h1v1h-1zM5 17h1v1h-1zM8 17h4v1h-4zM16 17h3v1h-3zM20 17h1v1h-1zM22 17h1v1h-1zM25 17h2v1h-2zM28 17h1v1h-1zM0 18h1v1h-1zM2 18h2v1h-2zM6 18h2v1h-2zM10 18h1v1h-1zM12 18h2v1h-2zM17 18h1v1h-1zM21 18h2v1h-2zM27 18h2v1h-2zM1 19h1v1h-1zM3 19h3v1h-3zM7 19h11v1h-11zM19 19h1v1h-1zM23 19h1v1h-1zM25 19h1v1h-1zM27 19h1v1h-1zM0 20h3v1h-3zM4 20h3v1h-3zM10 20h2v1h-2zM14 20h1v1h-1zM16 20h2v1h-2zM19 20h6v1h-6zM8 21h3v1h-3zM12 21h1v1h-1zM16 21h1v1h-1zM19 21h2v1h-2zM24 21h1v1h-1zM26 21h3v1h-3zM0 22h7v1h-7zM10 22h4v1h-4zM16 22h2v1h-2zM19 22h2v1h-2zM22 22h1v1h-1zM24 22h2v1h-2zM27 22h2v1h-2zM0 23h1v1h-1zM6 23h1v1h-1zM10 23h1v1h-1zM12 23h1v1h-1zM17 23h2v1h-2zM20 23h1v1h-1zM24 23h2v1h-2zM0 24h1v1h-1zM2 24h3v1h-3zM6 24h1v1h-1zM8 24h2v1h-2zM12 24h1v1h-1zM16 24h2v1h-2zM20 24h5v1h-5zM0 25h1v1h-1zM2 25h3v1h-3zM6 25h1v1h-1zM9 25h4v1h-4zM16 25h1v1h-1zM20 25h2v1h-2zM24 25h1v1h-1zM26 25h3v1h-3zM0 26h1v1h-1zM2 26h3v1h-3zM6 26h1v1h-1zM8 26h2v1h-2zM12 26h1v1h-1zM17 26h4v1h-4zM23 26h3v1h-3zM28 26h1v1h-1zM0 27h1v1h-1zM6 27h1v1h-1zM9 27h2v1h-2zM12 27h2v1h-2zM15 27h1v1h-1zM17 27h4v1h-4zM22 27h1v1h-1zM24 27h1v1h-1zM27 27h1v1h-1zM0 28h7v1h-7zM8 28h2v1h-2zM11 28h2v1h-2zM14 28h1v1h-1zM16 28h2v1h-2zM19 28h2v1h-2zM24 28h1v1h-1zM27 28h2v1h-2z";
function showQR(){
  const prev=document.activeElement;
  const ov=h("div",{class:"qrov",role:"dialog","aria-modal":"true","aria-label":"QR-Code zur App"});
  const box=h("div",{class:"qrbox"});
  const holder=h("div");
  holder.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 37" shape-rendering="crispEdges" role="img" aria-label="QR-Code"><rect width="37" height="37" fill="#fff"/><path transform="translate(4 4)" d="'+QR_PATH+'" fill="#000"/></svg>';
  function close(){document.removeEventListener("keydown",onKey);ov.remove();if(prev&&prev.focus)prev.focus();}
  function onKey(e){if(e.key==="Escape")close();}
  const closeBtn=h("button",{class:"btn primary",onclick:close},"Schließen");
  box.append(h("h2",null,"QR-Code mit dem iPad scannen"),holder,h("p",null,QR_URL),closeBtn);
  ov.append(box);
  ov.addEventListener("click",e=>{if(e.target===ov)close();});
  document.addEventListener("keydown",onKey);
  document.body.append(ov);closeBtn.focus();
}
document.getElementById("qrbtn").addEventListener("click",showQR);
home();
</script>
</body>
</html>
